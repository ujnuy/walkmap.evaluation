<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2b53">
  <title>걷기 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- 상단: 지금 있는 길 -->
  <button id="roadBox" class="pixel-box road-box" type="button" aria-label="이 길의 평가 보기">
    <span class="road-label">지금 있는 길</span>
    <span id="roadName" class="road-name">위치 찾는 중…</span>
    <span id="roadStats" class="road-stats"></span>
  </button>

  <!-- 오른쪽 버튼 -->
  <div class="side-buttons">
    <button id="followBtn" class="pixel-btn active" type="button" title="내 위치 따라가기">◎</button>
    <button id="clearBtn" class="pixel-btn" type="button" title="지나온 길 지우기">⌫</button>
  </div>

  <!-- 하단: 평가 버튼 -->
  <div class="bottom-bar">
    <button id="goodBtn" class="pixel-btn big good" type="button">😊 편해요</button>
    <button id="badBtn" class="pixel-btn big bad" type="button">😣 불편해요</button>
  </div>

  <!-- 평가 작성 창 -->
  <div id="rateSheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="pixel-box sheet-inner">
      <h2 id="rateTitle">이 길 평가하기</h2>
      <p id="rateRoad" class="muted"></p>
      <textarea id="rateComment" maxlength="200" rows="4" placeholder="코멘트를 남겨주세요 (선택, 200자 이내)&#10;예) 인도가 좁고 차가 많아요"></textarea>
      <div class="count"><span id="rateCount">0</span>/200</div>
      <div class="sheet-buttons">
        <button id="rateCancel" class="pixel-btn" type="button">취소</button>
        <button id="rateSave" class="pixel-btn primary" type="button">저장</button>
      </div>
    </div>
  </div>

  <!-- 길 평가 목록 창 -->
  <div id="listSheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="pixel-box sheet-inner">
      <h2 id="listTitle">이 길의 평가</h2>
      <p id="listSummary" class="muted"></p>
      <ul id="commentList" class="comment-list"></ul>
      <div class="sheet-buttons">
        <button id="listClose" class="pixel-btn primary" type="button">닫기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="sprite.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
