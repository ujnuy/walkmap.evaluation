<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <title>길걸음 - 걷기 길 평가 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" />
  <link rel="stylesheet" href="style.css?v=202611100631" />
</head>
<body>
  <div id="map"></div>

  <!-- ===== 시작 화면 ===== -->
  <div id="start" class="overlay">
    <div class="card">
      <h1>🚶 길걸음</h1>
      <p class="sub">걸으면서 길을 평가해요</p>
      <div id="startWalker" class="walker walking start-walker"></div>

      <button id="btnLogin" class="big primary">🔐 Google로 로그인하기</button>
      <p class="hint">지나온 길과 내가 쓴 글이 계정에 백업돼요.</p>

      <button id="btnGuest" class="big">게스트로 시작하기</button>
      <p class="hint">평가는 지도에 남지만, 사이트를 나가면 내가 쓴 글인지 알 수 없게 돼요.</p>
      <p id="loginNote" class="hint warn"></p>
      <div id="inAppNote" class="inapp-note hidden">
        <p id="inAppText"></p>
        <button id="btnOpenExternalStart" class="small-btn hidden">🌐 브라우저로 열기</button>
      </div>
    </div>
  </div>

  <!-- ===== 캐릭터 꾸미기 ===== -->
  <div id="custom" class="overlay hidden">
    <div class="card custom-card">
      <h2>🎨 캐릭터 꾸미기</h2>
      <div class="custom-stage">
        <div id="customPreview" class="walker walking big-walker"></div>
        <button id="btnRandom" class="dice" title="랜덤">🎲</button>
      </div>

      <div class="label">헤어스타일</div>
      <div id="pickHair" class="pick-row"></div>
      <div class="label">피부색</div>
      <div id="pickSkin" class="pick-row"></div>
      <div class="label">옷</div>
      <div id="pickOutfit" class="pick-row"></div>

      <button id="btnCustomDone" class="big primary">이 캐릭터로 시작하기</button>
      <button id="btnCustomCancel" class="big hidden">취소</button>
    </div>
  </div>

  <!-- ===== 안전신문고 민원 넣기 ===== -->
  <div id="complaint" class="overlay hidden">
    <div class="card complaint-card">
      <h2>📢 안전신문고 민원 넣기</h2>
      <p class="hint">아래 문안을 복사해서 안전신문고 신고 내용에 붙여넣으세요. 필요하면 고쳐도 돼요.</p>
      <textarea id="complaintText" rows="9"></textarea>
      <div id="complaintPhotoRow" class="complaint-photo hidden">
        <img id="complaintPhoto" alt="첨부할 사진" />
        <div>
          <a id="btnSavePhoto" class="small-btn" download="walkmap-민원사진.jpg">📷 사진 저장하기</a>
          <p class="hint">안전신문고에서는 사진을 직접 첨부해야 해요. 먼저 저장해 두세요.</p>
        </div>
      </div>
      <a id="btnGoSafety" class="big primary" target="_blank" rel="noopener">📋 복사하고 안전신문고로 이동</a>
      <button id="btnComplaintClose" class="big">닫기</button>
    </div>
  </div>

  <!-- ===== 내가 평가한 코멘트 ===== -->
  <aside id="myList" class="drawer hidden" aria-label="내가 평가한 코멘트">
    <div class="drawer-head">
      <strong>📝 내가 평가한 코멘트 <span id="myCount"></span></strong>
      <button id="btnMyListClose" title="닫기">✕</button>
    </div>
    <div id="myListBody" class="drawer-body"></div>
  </aside>

  <!-- ===== 메뉴 ===== -->
  <div id="menu" class="overlay hidden">
    <div class="card">
      <div id="accountInfo" class="account"></div>
      <button id="btnCustomize" class="big">🎨 캐릭터 꾸미기</button>
      <button id="btnExit" class="big">로그아웃</button>
      <button id="btnCloseMenu" class="big primary">닫기</button>
    </div>
  </div>

  <!-- 현재 위치 찾는 중 -->
  <div id="locating" class="locating hidden">
    <span id="locatingText"></span>
    <p id="locatingHint" class="locating-hint"></p>
    <div class="locating-actions">
      <button id="btnRetryLocate">🔄 다시 시도</button>
      <button id="btnLocateFree">🗺️ 자유모드로 들어가기</button>
      <button id="btnOpenExternal" class="hidden">🌐 브라우저로 열기</button>
    </div>
  </div>

  <!-- 상단 상태바 -->
  <header class="topbar">
    <div class="title">🚶 길걸음 <span id="who" class="who"></span></div>
    <div id="status" class="status"></div>
  </header>

  <!-- 자유모드: 평가할 위치 표시 -->
  <div id="crosshair" class="crosshair hidden" aria-hidden="true">
    <div class="crosshair-tag">여기를 평가</div>
    <div class="crosshair-mark"></div>
  </div>

  <!-- 위치 부정확 경고 -->
  <div id="accWarn" class="acc-warn hidden" role="status">
    <span id="accWarnText"></span>
    <button id="btnAccWarnClose" title="닫기">✕</button>
  </div>

  <!-- 지도 위 버튼 -->
  <div class="fab-group">
    <button id="btnMenu" class="fab" title="메뉴">☰</button>
    <button id="btnMyList" class="fab" title="내가 평가한 코멘트 보기">📝</button>
    <button id="btnFollow" class="fab active" title="내 위치 따라가기">◎</button>
    <button id="btnClear" class="fab" title="지나온 길 지우기">⌫</button>
  </div>

  <!-- 하단 평가 패널 -->
  <section id="panel" class="panel">
    <div class="handle" id="panelHandle"></div>
    <div class="road">
      <div class="road-head">
        <span id="roadLabel" class="label">지금 있는 길</span>
        <button id="btnFreeMode" class="free-btn">🗺️ 자유모드로 전환하기</button>
      </div>
      <strong id="roadName">-</strong>
      <span id="roadSummary" class="summary"></span>
    </div>

    <div class="rate-buttons">
      <button class="rate good" data-rating="good">😊 편해요</button>
      <button class="rate bad" data-rating="bad">😣 불편해요</button>
    </div>
    <button id="btnComplaint" class="complaint-btn hidden">📢 이 내용으로 민원 넣기</button>

    <textarea id="comment" maxlength="200" rows="2"
      placeholder="코멘트를 남겨주세요 (예: 보도블럭이 깨져 있어요, 그늘이 많아요)"></textarea>

    <div id="photoPreview" class="photo-preview hidden">
      <img alt="첨부한 사진" />
      <button id="btnRemovePhoto" title="사진 빼기">✕</button>
    </div>

    <div class="row">
      <label class="photo-btn">📷 사진
        <input id="photoInput" type="file" accept="image/*" hidden />
      </label>
      <span id="charCount" class="muted">0/200</span>
      <button id="btnSubmit" class="submit" disabled>남기기</button>
    </div>

    <details id="recent" class="recent">
      <summary>이 길의 코멘트 <span id="recentCount">0</span></summary>
      <ul id="recentList"></ul>
    </details>
  </section>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js?v=202611100631"></script>
</body>
</html>
